[project]
name = "basecamp-eden-saes"
version = "0.1.0"
description = "End-to-end sparse-autoencoder engine and feature viewer for the EDEN-7B DNA foundation model: OpenGenome2 corpus build, activation harvesting, BatchTopK SAE training, annotation-grounded autointerp, structural (CATH/TED) enrichment, and a standalone feature atlas viewer."
requires-python = ">=3.10,<3.14"
readme = "README.md"
authors = [{ name = "Goodfire" }]
license = { text = "Proprietary" }

# Base dependencies. These cover the corpus/annotation post-processing, the
# autointerp span-metric engine, the structure-beyond-sequence analysis, and the
# deterministic atlas/metrics reproduction check -- i.e. everything that does NOT
# need a GPU or the model weights. The private goodfire-core dependency and torch
# live in the [engine] extra so this base set installs (and the tight reproduction
# runs) without access to the private Goodfire package index.
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
# GPU + model engine: corpus tokenization, activation harvesting, SAE training.
# goodfire-core is a PRIVATE Goodfire repository (see README "Installation").
engine = [
    "goodfire-core",
    "torch>=2.0.0",
    "huggingface-hub>=0.24.0",
    "pytantan>=0.1.4",
    "transformers>=4.40.0",
    "wandb",
]
# Annotation-panel build (Pfam/GO domains, CATH/TED fold layers).
annotations = [
    "pyhmmer>=0.10.0",
    "biopython>=1.81",
]
# Structure coverage: AlphaFold-DB download + pLDDT, UniProt/UniParc mapping.
structure = [
    "gemmi>=0.6.0",
    "requests>=2.28.0",
]
# Figures for the results/report pages.
viz = [
    "plotly>=6.0.0",
    "kaleido==0.2.1",
]
all = [
    "basecamp-eden-saes[engine,annotations,structure,viz]",
]

[project.scripts]
# Corpus build / activation harvest / SAE grid.
bes-build-corpus = "basecamp_eden_saes.corpus.build:main"
bes-harvest = "basecamp_eden_saes.harvest.disk:main"
bes-harvest-codes = "basecamp_eden_saes.harvest.code_store:main"
bes-train-sae = "basecamp_eden_saes.sae.sweep:main"
bes-select-sae = "basecamp_eden_saes.sae.select:main"
# Autointerp span metrics + reproduction check.
bes-span-cover = "basecamp_eden_saes.autointerp.join_cover:main"
bes-span-reduce = "basecamp_eden_saes.autointerp.reduce:main"
bes-reproduce = "basecamp_eden_saes.autointerp.reproduce:main"
# Structure-beyond-sequence analysis.
bes-rejoin = "basecamp_eden_saes.analysis.rejoin:main"
bes-generalization = "basecamp_eden_saes.analysis.generalization:main"
# Atlas builder.
bes-build-atlas = "basecamp_eden_saes.atlas.rebuild:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basecamp_eden_saes"]

[tool.hatch.metadata]
allow-direct-references = true

# goodfire-core is a private Goodfire repository, pinned to the revision the
# harvest / SAE-training experiments in the source thread ran against. On a Silico
# cluster this resolves with no extra config (the deploy-key git URL rewrite is
# pre-provisioned). Elsewhere, see README "Installation" for the access options.
[tool.uv.sources]
goodfire-core = { git = "https://github.com/goodfire-ai/goodfire-core.git", rev = "b4c2083ef0066f1a8563a21cb334fe4f258100d4" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
